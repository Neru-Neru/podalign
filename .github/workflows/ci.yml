name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu の ffmpeg は librubberband 有効ビルド(ドリフト補正に必須)
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Verify librubberband
        run: ffmpeg -filters | grep -q rubberband
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - name: Lint
        run: uv run ruff check app tests benchmarks
      - name: Python type check
        run: uv run mypy app tests/audio_fixtures.py benchmarks
      - name: Full tests (incl. E2E on pull requests)
        run: uv run pytest -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Install browser for GUI regression tests
        uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm run test:trim
        working-directory: web
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}

  docker:
    # main への push とリリースタグのみ: GHCR へ build & push(§1-2)
    if: github.event_name == 'push'
    needs: [test, web-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
