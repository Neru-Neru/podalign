[project]
name = "podalign"
version = "0.1.0"
description = "±1ms offset / ±1ppm drift auto-sync and mastering pipeline for double-ender podcast recordings"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 実素材級の長時間テスト"]
